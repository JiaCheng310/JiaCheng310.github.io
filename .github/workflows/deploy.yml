name: Deploy homepage and Notes to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static homepage
        run: |
          mkdir -p out
          cp -R site/. out/
          test -f out/index.html

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render Notes
        run: |
          test "$(quarto --version)" = "1.10.18"
          quarto render quarto-notes
          python3 quarto-notes/scripts/optimize-math-html.py --check
          mkdir -p out/notes
          cp -R quarto-notes/_site/. out/notes/
          touch out/.nojekyll
          test -f out/notes/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
